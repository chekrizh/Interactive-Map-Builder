ddy next time.", "members": ["pipeline", "feeds", "search", "pagecache", "pagefiles"]}, "write": {"title": "Post, vote, moderate", "huekey": "component", "icon": "pen-line", "line1": "Stories, comments, votes", "line2": "and the ranking rules.", "chips": "Story · Comment · Vote", "text": "Submitting stories, commenting (on the site or by email), voting and flagging, and the moderation tools. The models recompute score and hotness on every vote.", "members": ["stories", "comments", "ranking", "mailbox", "modtools"]}, "background": {"title": "Background work", "huekey": "background", "icon": "timer", "line1": "Jobs after the response,", "line2": "schedules and cron.", "chips": "Solid Queue · cron", "text": "Notifications, link previews and webmentions run as jobs; recurring tasks and two cron scripts keep caches, stats, backups and the Mastodon bot going.", "members": ["notify", "enrich", "recurring", "cron"]}, "storage": {"title": "Storage", "huekey": "store", "icon": "database", "line1": "Four SQLite databases:", "line2": "data, cache, queue, throttle.", "chips": "SQLite · FTS5 · Solid Cache", "text": "The primary database holds everything users create; Solid Cache and Rack::Attack use their own files; Solid Queue keeps its jobs in a fourth.", "members": ["primary", "cache", "queue"]}, "outside": {"title": "Outside services", "huekey": "external", "icon": "globe", "line1": "Linked sites, Mastodon,", "line2": "Pushover.", "chips": "HTTPS", "text": "The web pages stories link to, the Mastodon instance the bot posts to, and Pushover for phone notifications.", "members": ["sites", "mastodon", "pushover"]}}, "overview": [{"g": "people"}, {"g": "front"}, {"g": "pages"}, {"g": "write"}, {"g": "background"}, {"g": "storage"}, {"g": "outside"}], "overviewEdges": [{"id": "o1", "from": "people", "to": "front", "label": "HTTPS, email"}, {"id": "o2", "from": "front", "to": "pages", "label": "cache miss"}, {"id": "o3", "from": "front", "to": "write", "label": "posts, replies"}, {"id": "o4", "from": "write", "to": "background", "label": "enqueue jobs"}, {"id": "o5", "from": "write", "to": "storage", "label": "rows"}, {"id": "o6", "from": "pages", "to": "storage", "label": "queries"}, {"id": "o7", "from": "background", "to": "outside", "label": "push, post, fetch"}, {"id": "o8", "from": "background", "to": "pages", "label": "refill cache"}], "zones": [{"id": "people", "label": "People", "hue": "person"}, {"id": "edge", "label": "Front door · Caddy and Anubis", "hue": "external"}, {"id": "web", "label": "Web process · Rails on Puma", "hue": "component"}, {"id": "worker", "label": "Background · Solid Queue and cron", "hue": "background"}, {"id": "data", "label": "Storage · files on the server", "hue": "store"}, {"id": "outside", "label": "Mail server and outside services", "hue": "external"}], "nodes": [{"id": "visitor", "group": "people", "cat": "person", "step": 1, "icon": "user", "shape": "person", "zone": "people", "tool": "Person", "concept": "Visitor", "what": "Someone reading without logging in: a browser, an RSS reader or a crawler. Gets the same HTML as every other visitor.", "why": "Most traffic is logged out, so the whole caching design is built around this reader: no session cookie, no per-user HTML, no JavaScript.", "tools": "Browser · RSS reader · \u003ccode>/rss\u003c/code>, \u003ccode>/newest.rss\u003c/code>, \u003ccode>/t/&lt;tag&gt;.rss\u003c/code>"}, {"id": "member", "group": "people", "cat": "person", "step": 2, "icon": "user-check", "shape": "person", "zone": "people", "tool": "Person", "concept": "Member", "what": "A logged-in user, admitted by invitation unless signups are opened. Submits stories, comments, votes and flags, filters tags, and in mailing-list mode can reply by email.", "why": "Every write comes from a member. A logged-in request carries a session cookie, which makes Caddy skip the cached file and go to Rails.", "tools": "Session cookie \u003ccode>lobster_trap\u003c/code> · invitations · optional 2FA"}, {"id": "moderator", "group": "people", "cat": "person", "step": 6, "icon": "user-cog", "shape": "person", "zone": "people", "tool": "Person", "concept": "Moderator", "what": "A member with \u003ccode>is_moderator\u003c/code>: edits, deletes and merges stories, bans domains and users, reads mod mail and the flag and hotspot dashboards.", "why": "The site is run by volunteers, so moderation is built into the app rather than an admin console; every action is logged publicly in \u003ccode>/moderations\u003c/code>.", "tools": "\u003ccode>/mod\u003c/code> · \u003ccode>/moderations\u003c/code> · \u003ccode>/jobs\u003c/code> (Mission Control)"}, {"id": "caddy", "group": "front", "cat": "external", "step": 1, "icon": "globe-lock", "logo": "caddy", "zone": "edge", "tool": "Container · Caddy via Hatchbox", "concept": "Caddy web server", "what": "Terminates TLS, redirects to HTTPS, blocks some bots, and for a request without an app cookie serves the page straight from \u003ccode>public/cache/\u003c/code>. Anything else goes on to Anubis on port 9000.", "why": "This is the reason a small server copes: a cached front page is a static file and never wakes Ruby.", "tools": "\u003ccode>hatchbox/Caddyfile.pre\u003c/code> · \u003ccode>hatchbox/Caddyfile\u003c/code> · \u003ccode>hatchbox/Caddyfile.post\u003c/code>"}, {"id": "anubis", "group": "front", "cat": "external", "step": 6, "icon": "shield-check", "zone": "edge", "tool": "Container · Anubis", "concept": "Anubis bot filter", "what": "A proof-of-work challenge proxy listening on 127.0.0.1:9000 and forwarding to Puma on 9001, with its own bot policy file.", "why": "Scrapers that hammer uncached pages would otherwise land on Rails. The app keeps Anubis's cookie and Caddy ignores it when deciding whether to serve a cached file.", "tools": "\u003ccode>hatchbox/lobsters.anubis.env\u003c/code> · \u003ccode>hatchbox/lobsters.botPolicies.yaml\u003c/code>"}, {"id": "postfix", "group": "front", "cat": "external", "step": 7, "icon": "mail", "zone": "outside", "tool": "Container · Postfix with OpenDKIM", "concept": "Mail server", "what": "Runs on the same server, set up from \u003ccode>hatchbox/\u003c/code>. Sends the app's mail on port 25, relayed through a hosted SMTP service and signed with DKIM. Mail to the site's domain is piped to \u003ccode>script/lobsters-ingress\u003c/code>, which posts it to Action Mailbox.", "why": "Reply notifications and password resets need mail; replies to mailing-list emails come back in as comments.", "tools": "\u003ccode>hatchbox/main.cf\u003c/code> · \u003ccode>hatchbox/transport\u003c/code> · \u003ccode>config/initializers/email.rb\u003c/code> · \u003ccode>script/lobsters-ingress\u003c/code>"}, {"id": "pipeline", "group": "pages", "cat": "component", "step": 1, "icon": "filter", "zone": "web", "tool": "Component · Rack + ApplicationController", "concept": "Request pipeline", "what": "Rack::Attack throttles each IP, \u003ccode>config/routes.rb\u003c/code> picks the controller, and \u003ccode>ApplicationController\u003c/code> loads the user from the session, drops unknown cookies, and clears the session cookie for anonymous visitors.", "why": "Clearing the cookie is what keeps logged-out visitors on the cached path: Caddy only serves a file when there is no app cookie.", "tools": "\u003ccode>app/controllers/application_controller.rb\u003c/code> · \u003ccode>app/controllers/concerns/authenticatable.rb\u003c/code> · \u003ccode>config/initializers/rack_attack.rb\u003c/code>"}, {"id": "feeds", "group": "pages", "cat": "component", "step": 1, "icon": "newspaper", "zone": "web", "tool": "Component · HomeController", "concept": "Story lists and feeds", "what": "The front page, /newest, /active, /top, tag, category, domain and origin pages, as HTML, JSON or RSS. Lists come from \u003ccode>Story\u003c/code> scopes, 25 per page.", "why": "These are the most-read pages. For anonymous visitors each list is cached for 45 seconds and the rendered page is written to disk with \u003ccode>caches_page\u003c/code>.", "tools": "\u003ccode>app/controllers/home_controller.rb\u003c/code> · \u003ccode>app/models/stories_paginator.rb\u003c/code> · \u003ccode>app/views/home/\u003c/code>"}, {"id": "search", "group": "pages", "cat": "component", "step": 5, "icon": "search", "zone": "web", "tool": "Component · Search", "concept": "Search", "what": "Parses a query with tag:, domain:, submitter:, title: and quoted terms, then matches story text or comments through SQLite FTS5 tables.", "why": "Search runs in the main database with no search server, in line with the project's rule of few moving parts.", "tools": "\u003ccode>app/models/search.rb\u003c/code> · \u003ccode>app/models/search_parser.rb\u003c/code> · \u003ccode>app/models/full_text_search.rb\u003c/code>"}, {"id": "pagecache", "group": "pages", "cat": "background", "step": 3, "icon": "refresh-cw", "zone": "worker", "inside": "pagecache", "tool": "Jobs · CachePageJob and friends", "concept": "Page cache refill", "what": "After a vote, comment or edit, Rails enqueues \u003ccode>CachePageJob\u003c/code> for the story's page. The job renders the path in-process as an anonymous request and writes the HTML file. \u003ccode>PrefillPageCacheJob\u003c/code> warms the busiest pages every 2 minutes; \u003ccode>RefillStoryPageCacheJob\u003c/code> rewrites every story page after a deploy.", "why": "Pages are refreshed by a job instead of being deleted, so Caddy keeps serving a file and no visitor waits for a render.", "tools": "\u003ccode>app/jobs/cache_page_job.rb\u003c/code> · \u003ccode>app/jobs/prefill_page_cache_job.rb\u003c/code> · \u003ccode>app/jobs/refill_story_page_cache_job.rb\u003c/code>"}, {"id": "pagefiles", "group": "pages", "cat": "store", "step": 3, "icon": "files", "shape": "database", "zone": "data", "tool": "Files · public/cache/", "concept": "Full-page cache", "what": "Rendered HTML, JSON and RSS files named after their URL, shared between deploys. A cron job deletes files older than 3 minutes, except story pages under \u003ccode>s/\u003c/code>, which jobs rewrite.", "why": "A file on disk that Caddy can serve is the cheapest possible response. The writer is patched to write atomically so Caddy never serves a half-written file.", "tools": "\u003ccode>actionpack-page_caching\u003c/code> · \u003ccode>config/initializers/page_caching_monkeypatch.rb\u003c/code> · \u003ccode>script/expire_page_cache\u003c/code>"}, {"id": "stories", "group": "write", "cat": "component", "step": 2, "icon": "link", "zone": "web", "tool": "Component · StoriesController", "concept": "Story submission and votes", "what": "Submit, edit, delete, upvote, flag, hide and save stories. A new URL is fetched to suggest a title; a saved story enqueues a link preview job and, five minutes later, a webmention.", "why": "Every action that changes a story ends by asking for its cached page to be rebuilt, in one \u003ccode>after_action\u003c/code>.", "tools": "\u003ccode>app/controllers/stories_controller.rb\u003c/code> · \u003ccode>extras/sponge.rb\u003c/code>"}, {"id": "comments", "group": "write", "cat": "component", "step": 4, "icon": "message-square", "zone": "web", "inside": "comments", "tool": "Component · CommentsController", "concept": "Comments", "what": "Post, edit, delete, vote and flag comments, plus the comments feed and threads pages. A posted comment enqueues \u003ccode>NotifyCommentJob\u003c/code>.", "why": "Replies are the core of the site. The controller answers at once; notifying people happens in the worker.", "tools": "\u003ccode>app/controllers/comments_controller.rb\u003c/code> · \u003ccode>app/models/comment.rb\u003c/code>"}, {"id": "ranking", "group": "write", "cat": "component", "step": 2, "icon": "trending-up", "zone": "web", "inside": "ranking", "tool": "Models · Story, Comment, Vote", "concept": "Votes and ranking", "what": "\u003ccode>Vote.vote_thusly_on_story_or_comment_for_user_because\u003c/code> records a vote, adjusts karma and has the story or comment recount its score from the votes table. Stories then get a new \u003ccode>hotness\u003c/code>, comments a new \u003ccode>confidence\u003c/code>.", "why": "Ranking lives in the models, so a vote from the site, a moderator action or a comment saved from email all go through the same code.", "tools": "\u003ccode>app/models/vote.rb\u003c/code> · \u003ccode>app/models/story.rb\u003c/code> · \u003ccode>app/models/comment.rb\u003c/code>"}, {"id": "mailbox", "group": "write", "cat": "component", "step": 7, "icon": "inbox", "zone": "web", "tool": "Component · Action Mailbox", "concept": "Reply by email", "what": "\u003ccode>InboxMailbox\u003c/code> takes mail addressed to \u003ccode>&lt;shortname&gt;-&lt;token&gt;@\u003c/code>, finds the member by mailing-list token and the parent from \u003ccode>In-Reply-To\u003c/code>, strips signatures and quotes, and saves a comment.", "why": "Members in mailing-list mode get new stories and comments by email (from \u003ccode>script/mail_new_activity.rb\u003c/code>, whose \u003ccode>Reply-To\u003c/code> is that address) and can answer from their mail client. That script is commented out in \u003ccode>script/lobsters-cron\u003c/code>, so this path probably sees little use today. Anything it cannot match is bounced.", "tools": "\u003ccode>app/mailboxes/application_mailbox.rb\u003c/code> · \u003ccode>app/mailboxes/inbox_mailbox.rb\u003c/code>"}, {"id": "modtools", "group": "write", "cat": "component", "step": 6, "icon": "gavel", "zone": "web", "tool": "Component · Mod:: controllers", "concept": "Moderation tools", "what": "Dashboards of flagged stories and comments, the hotspot list of comments scored by a naive Bayes model, mod notes, mod mail, domain and origin bans, story merges and tag edits. Moderator actions are recorded as \u003ccode>Moderation\u003c/code> rows, shown publicly at \u003ccode>/moderations\u003c/code>.", "why": "Flags only hide content from the ranking; people decide. The tools put the evidence in one place and the log keeps moderators accountable.", "tools": "\u003ccode>app/controllers/mod/\u003c/code> · \u003ccode>app/models/moderation.rb\u003c/code> · \u003ccode>app/models/hotspot_doc.rb\u003c/code>"}, {"id": "notify", "group": "background", "cat": "background", "step": 4, "icon": "bell-ring", "zone": "worker", "tool": "Job · NotifyCommentJob", "concept": "Reply and mention notifier", "what": "For each new comment: notify the story's submitter (if following) and the parent comment's author, then anyone @-mentioned. Each gets one \u003ccode>Notification\u003c/code> row, and by their settings an email and a Pushover push.", "why": "Emailing inside the request would make posting slow and fragile; as a job, a failed send never loses the comment.", "tools": "\u003ccode>app/jobs/notify_comment_job.rb\u003c/code> · \u003ccode>app/mailers/email_reply_mailer.rb\u003c/code> · \u003ccode>extras/pushover.rb\u003c/code>"}, {"id": "enrich", "group": "background", "cat": "background", "step": 5, "icon": "image", "zone": "worker", "tool": "Jobs · CreateStoryCardJob, SendWebmentionJob", "concept": "Link preview and webmention", "what": "Fetch the linked page's card image and save a PNG under \u003ccode>public/story_image/\u003c/code>; five minutes after submission, look for a webmention endpoint on the page and notify it.", "why": "Both talk to arbitrary sites, so they run out of the request with timeouts, through \u003ccode>Sponge\u003c/code>, which refuses private IP addresses.", "tools": "\u003ccode>app/jobs/create_story_card_job.rb\u003c/code> · \u003ccode>app/models/story_image.rb\u003c/code> · \u003ccode>app/jobs/send_webmention_job.rb\u003c/code>"}, {"id": "recurring", "group": "background", "cat": "background", "step": 3, "icon": "clock", "zone": "worker", "tool": "Solid Queue recurring tasks", "concept": "Recurring jobs", "what": "Scheduled in \u003ccode>config/recurring.yml\u003c/code>: prefill the page cache every 2 minutes, WAL checkpoint every minute, traffic stats every 5 minutes, flagged commenters every 15, hotspot refresh hourly, stats graphs, sitemap and a Restic backup nightly.", "why": "The queue's own scheduler replaces most cron entries, so jobs share one process, one log and the Mission Control dashboard.", "tools": "\u003ccode>config/recurring.yml\u003c/code> · \u003ccode>config/queue.yml\u003c/code> · \u003ccode>app/jobs/\u003c/code>"}, {"id": "cron", "group": "background", "cat": "background", "step": 8, "icon": "calendar-clock", "zone": "worker", "tool": "Hatchbox cron", "concept": "Cron scripts", "what": "Two crontab entries: \u003ccode>script/expire_page_cache\u003c/code> every minute and \u003ccode>script/lobsters-cron\u003c/code> every 5 minutes, which runs \u003ccode>script/mastodon_post.rb\u003c/code> to post up to ten hot stories that have not been posted yet.", "why": "These predate Solid Queue. The mailing-list script is still in the repo but commented out in \u003ccode>lobsters-cron\u003c/code>.", "tools": "\u003ccode>script/lobsters-cron\u003c/code> · \u003ccode>script/mastodon_post.rb\u003c/code> · \u003ccode>script/expire_page_cache\u003c/code>"}, {"id": "primary", "group": "storage", "cat": "store", "step": 1, "icon": "database", "logo": "sqlite", "shape": "database", "zone": "data", "inside": "primary", "tool": "SQLite · storage/primary.sqlite3", "concept": "Primary database", "what": "Users, stories, comments, votes, tags, notifications, messages, moderation logs, plus FTS5 tables for search. Backed up nightly with \u003ccode>.backup\u003c/code> and Restic.", "why": "One file on the same disk: no database server to run. The app builds its own SQLite with compile flags, so the README says to use \u003ccode>bin/sqlite3\u003c/code>.", "tools": "\u003ccode>db/schema.rb\u003c/code> · \u003ccode>db/migrate/\u003c/code> · \u003ccode>config/database.yml.sample\u003c/code>"}, {"id": "cache", "group": "storage", "cat": "store", "step": 5, "icon": "hard-drive", "logo": "sqlite", "shape": "database", "zone": "data", "tool": "SQLite · Solid Cache", "concept": "Cache databases", "what": "Two Solid Cache shards in their own files: \u003ccode>cache.sqlite3\u003c/code> for \u003ccode>Rails.cache\u003c/code> (story lists, RSS, debounce keys) and \u003ccode>rack_attack.sqlite3\u003c/code> for the rate limiter's counters.", "why": "Throttle counters churn constantly; giving them their own file keeps them from evicting useful cache entries.", "tools": "\u003ccode>config/cache.yml\u003c/code> · \u003ccode>db/cache_schema.rb\u003c/code> · \u003ccode>db/rack_attack_schema.rb\u003c/code>"}, {"id": "queue", "group": "storage", "cat": "store", "step": 3, "icon": "list-ordered", "logo": "sqlite", "shape": "queue", "zone": "data", "tool": "SQLite · Solid Queue", "concept": "Job queue", "what": "Jobs, ready and scheduled executions, recurring tasks and concurrency semaphores. Two queues matter: \u003ccode>default\u003c/code> and \u003ccode>refill_story_pages\u003c/code>, which only one worker serves.", "why": "A queue in a database means no Redis. Semaphores give \u003ccode>limits_concurrency\u003c/code>, so the same page is never rendered twice at once.", "tools": "\u003ccode>db/queue_schema.rb\u003c/code> · \u003ccode>config/queue.yml\u003c/code> · \u003ccode>bin/jobs\u003c/code>"}, {"id": "sites", "group": "outside", "cat": "external", "step": 2, "icon": "globe", "shape": "external", "zone": "outside", "tool": "External systems", "concept": "Linked websites", "what": "The pages stories point to. Lobsters fetches them to suggest a title, find a card image and send a webmention.", "why": "Fetching user-supplied URLs is risky, so every request goes through \u003ccode>Sponge\u003c/code> with short timeouts and a block on private networks.", "tools": "HTTP(S) · \u003ccode>extras/sponge.rb\u003c/code>"}, {"id": "mastodon", "group": "outside", "cat": "external", "step": 8, "icon": "message-circle", "logo": "mastodon", "shape": "external", "zone": "outside", "tool": "External system", "concept": "Mastodon instance", "what": "The bot account posts hot stories (score 2 or more, under two days old, not tagged meta) that have not been posted yet; members can also link their own Mastodon account in settings.", "why": "Followers on the fediverse see stories without visiting the site.", "tools": "\u003ccode>extras/mastodon.rb\u003c/code> · Mastodon REST API"}, {"id": "pushover", "group": "outside", "cat": "external", "step": 4, "icon": "smartphone", "shape": "external", "zone": "outside", "tool": "External system", "concept": "Pushover", "what": "A push notification service. Members who connect it get replies and mentions on their phone.", "why": "An alternative to email for people who want to answer quickly; it is skipped entirely when no API token is configured.", "tools": "\u003ccode>extras/pushover.rb\u003c/code> · HTTPS API"}], "edges": [{"id": "vi_ca", "from": "visitor", "to": "caddy", "label": "GET page"}, {"id": "me_ca", "from": "member", "to": "caddy", "label": "HTTPS + cookie"}, {"id": "mo_ca", "from": "moderator", "to": "caddy", "label": "HTTPS /mod"}, {"id": "me_po", "from": "member", "to": "postfix", "label": "reply email"}, {"id": "ca_pf", "from": "caddy", "to": "pagefiles", "label": "try_files"}, {"id": "ca_an", "from": "caddy", "to": "anubis", "label": "proxy :9000"}, {"id": "an_pi", "from": "anubis", "to": "pipeline", "label": "proxy :9001"}, {"id": "pi_fe", "from": "pipeline", "to": "feeds", "label": "GET /, /newest"}, {"id": "pi_st", "from": "pipeline", "to": "stories", "label": "POST upvote"}, {"id": "pi_co", "from": "pipeline", "to": "comments", "label": "POST /comments"}, {"id": "pi_se", "from": "pipeline", "to": "search", "label": "GET /search"}, {"id": "pi_mo", "from": "pipeline", "to": "modtools", "label": "/mod"}, {"id": "fe_ch", "from": "feeds", "to": "cache", "label": "list, 45 s"}, {"id": "fe_db", "from": "feeds", "to": "primary", "label": "Story.hottest"}, {"id": "fe_pf", "from": "feeds", "to": "pagefiles", "label": "caches_page"}, {"id": "se_db", "from": "search", "to": "primary", "label": "FTS5 MATCH"}, {"id": "st_si", "from": "stories", "to": "sites", "label": "fetch title"}, {"id": "st_ra", "from": "stories", "to": "ranking", "label": "save, vote"}, {"id": "co_ra", "from": "comments", "to": "ranking", "label": "save, vote"}, {"id": "mb_ra", "from": "mailbox", "to": "ranking", "label": "Comment save!"}, {"id": "mo_ra", "from": "modtools", "to": "ranking", "label": "edit, merge"}, {"id": "ra_db", "from": "ranking", "to": "primary", "label": "UPDATE score"}, {"id": "st_qu", "from": "stories", "to": "queue", "label": "enqueue"}, {"id": "co_qu", "from": "comments", "to": "queue", "label": "enqueue"}, {"id": "po_mb", "from": "postfix", "to": "mailbox", "label": "relay POST"}, {"id": "qu_pc", "from": "queue", "to": "pagecache", "label": "CachePageJob"}, {"id": "qu_no", "from": "queue", "to": "notify", "label": "NotifyCommentJob"}, {"id": "qu_en", "from": "queue", "to": "enrich", "label": "card, webmention"}, {"id": "qu_re", "from": "queue", "to": "recurring", "label": "on schedule"}, {"id": "pc_pi", "from": "pagecache", "to": "pipeline", "label": "in-process GET"}, {"id": "pc_pf", "from": "pagecache", "to": "pagefiles", "label": "write HTML"}, {"id": "no_db", "from": "notify", "to": "primary", "label": "Notification"}, {"id": "no_po", "from": "notify", "to": "postfix", "label": "SMTP"}, {"id": "no_pu", "from": "notify", "to": "pushover", "label": "HTTPS push"}, {"id": "po_me", "from": "postfix", "to": "member", "label": "email"}, {"id": "pu_me", "from": "pushover", "to": "member", "label": "push"}, {"id": "en_si", "from": "enrich", "to": "sites", "label": "GET, POST"}, {"id": "re_db", "from": "recurring", "to": "primary", "label": "stats, WAL"}, {"id": "cr_ma", "from": "cron", "to": "mastodon", "label": "post status"}, {"id": "cr_pf", "from": "cron", "to": "pagefiles", "label": "rm after 3 min"}], "flows": {"frontpage": {"title": "A visitor opens the front page", "hue": "component", "desc": "A logged-out reader asks for /. Most of the time Caddy answers from a file; on a miss Rails renders the page and writes the file for the next reader.", "hops": [{"e": "vi_ca", "t": "The browser sends \u003ccode>GET /\u003c/code> with no app cookie. Caddy's cookie map treats an Anubis-only cookie as no cookie, and there is no \u003ccode>?token=\u003c/code>."}, {"e": "ca_pf", "t": "Caddy tries \u003ccode>public/cache/index.html\u003c/code>. On a hit it rewrites the request to that file, adds a CSP header and is done: Rails never sees the request."}, {"e": "ca_an", "t": "On a miss (expired by cron, or never written) the request goes to Anubis on port 9000, which may ask the browser to solve a challenge first."}, {"e": "an_pi", "t": "Anubis forwards to Puma on 9001. Rack::Attack applies its per-IP throttles, the router picks \u003ccode>home#index\u003c/code>, and no user is loaded because there is no session."}, {"e": "pi_fe", "t": "\u003ccode>HomeController#index\u003c/code> asks for the hottest stories, page 1."}, {"e": "fe_ch", "t": "For anonymous visitors the story list is read through \u003ccode>Rails.cache\u003c/code> with a 45-second lifetime, so most renders skip the query."}, {"e": "fe_db", "t": "On a cache miss \u003ccode>Story.hottest\u003c/code> runs: visible, unmerged, not hidden, non-negative score, ordered by the stored \u003ccode>hotness\u003c/code> column, 26 rows to know whether there is a next page."}, {"e": "fe_pf", "t": "\u003ccode>caches_page\u003c/code> fires because there is no user, no tag-filter cookie and an empty session, and writes the HTML to \u003ccode>public/cache/index.html\u003c/code> for the next visitor."}]}, "upvote": {"title": "A member upvotes a story", "hue": "component", "desc": "One click recounts the story's score and hotness in a single UPDATE, then a job re-renders the story's cached page.", "hops": [{"e": "me_ca", "t": "The click sends \u003ccode>POST /stories/&lt;short_id&gt;/upvote\u003c/code> with the session cookie, so Caddy does not look for a cached file."}, {"e": "ca_an", "t": "Caddy proxies to Anubis; the member already holds its cookie."}, {"e": "an_pi", "t": "Rails loads the user from \u003ccode>session[:u]\u003c/code>. Without one, the action answers 400 instead of redirecting, since it is called from JavaScript."}, {"e": "pi_st", "t": "\u003ccode>StoriesController#upvote\u003c/code> refuses deleted or merged stories, then calls the vote method with +1."}, {"e": "st_ra", "t": "\u003ccode>Vote.vote_thusly…\u003c/code> finds or starts this member's vote row, works out the score and flag change, and saves the vote. The submitter gains one karma unless they voted for themselves."}, {"e": "ra_db", "t": "One UPDATE recounts score and flags from the votes table (ignoring flags from people who commented) and stores the new \u003ccode>hotness\u003c/code> computed from score, comments, tags and age."}, {"e": "st_qu", "t": "The controller's \u003ccode>after_action\u003c/code> calls \u003ccode>refill_story_page_cache\u003c/code>: a 2-minute debounce key in the cache, then a \u003ccode>CachePageJob\u003c/code> for the story's path. The response is just \u003ccode>ok\u003c/code>."}, {"e": "qu_pc", "t": "A worker thread claims the job. \u003ccode>limits_concurrency\u003c/code> discards a second job for the same path while one runs."}, {"e": "pc_pi", "t": "The job renders the story page through the app in-process, as an anonymous HTTPS request, exactly as a visitor would see it."}, {"e": "pc_pf", "t": "The HTML is written atomically over \u003ccode>public/cache/s/&lt;short_id&gt;/&lt;slug&gt;.html\u003c/code>, and files with older title slugs are removed. The next visitor gets the new score from Caddy."}]}, "comment": {"title": "A comment reaches the person it answers", "hue": "background", "desc": "A member replies to a comment. The request saves it and returns; the worker writes the notification and sends an email and a push.", "hops": [{"e": "me_ca", "t": "The reply form posts to \u003ccode>/comments\u003c/code> with the story's short id and the parent comment's short id."}, {"e": "ca_an", "t": "Logged in, so straight past the page cache to Anubis."}, {"e": "an_pi", "t": "The session gives \u003ccode>@user\u003c/code>; the router picks \u003ccode>comments#create\u003c/code>."}, {"e": "pi_co", "t": "The controller checks the story still exists, the parent belongs to it, the text is not a double submit and the member is not over the speed limit."}, {"e": "co_ra", "t": "Saving the comment sets its thread and depth; after commit it records the author's own upvote, recomputes the comment's confidence and the story's comment count and hotness, and queues a hotspot index job."}, {"e": "ra_db", "t": "The comment row, its FTS5 entry and the vote are written; the story gets \u003ccode>last_comment_at\u003c/code>, the parent \u003ccode>last_reply_at\u003c/code>."}, {"e": "co_qu", "t": "\u003ccode>NotifyCommentJob.perform_later\u003c/code> goes on the queue and the browser gets the rendered comment back. A page refill for the story is queued too."}, {"e": "qu_no", "t": "The worker picks the job up and finds who should hear: the parent's author if active, and the submitter if following the story. People who hid the story are skipped."}, {"e": "no_db", "t": "One \u003ccode>Notification\u003c/code> row per person; a unique index means nobody is notified twice for the same comment."}, {"e": "no_po", "t": "If the recipient wants reply emails, \u003ccode>EmailReplyMailer.reply\u003c/code> goes out over SMTP to the local Postfix. A send error is swallowed."}, {"e": "po_me", "t": "Postfix relays the DKIM-signed mail. Its \u003ccode>Message-Id\u003c/code>, \u003ccode>In-Reply-To\u003c/code> and \u003ccode>References\u003c/code> headers thread it with the story's other emails in the member's mail client."}, {"e": "no_pu", "t": "If the recipient enabled Pushover replies, the same text is pushed to their phone through Pushover's API."}, {"e": "pu_me", "t": "The member sees the reply on their phone with a link straight to it."}]}, "submit": {"title": "A member submits a story", "hue": "component", "desc": "The URL is fetched to suggest a title, the story is saved with its first vote and hotness, and two jobs reach back out to the linked site.", "hops": [{"e": "me_ca", "t": "The member opens \u003ccode>/stories/new\u003c/code>, pastes a URL, and finally posts the form to \u003ccode>/stories\u003c/code>."}, {"e": "ca_an", "t": "Logged in, so the request goes through Anubis to Rails."}, {"e": "an_pi", "t": "\u003ccode>verify_user_can_submit_stories\u003c/code> runs before the action."}, {"e": "pi_st", "t": "\u003ccode>StoriesController\u003c/code> builds the story from the form."}, {"e": "st_si", "t": "While the member fills in the form, \u003ccode>/stories/new?url=\u003c/code> or the form's call to \u003ccode>/stories/fetch_url_attributes\u003c/code> has Rails fetch the page with \u003ccode>Sponge\u003c/code> (3-second timeout, private IPs refused) to suggest its title and canonical URL; PDFs are read too."}, {"e": "st_ra", "t": "Validation checks tags, duplicates, banned domains and origins, and new-user rules. On create the story gets a short id, its submitter's upvote and its first \u003ccode>hotness\u003c/code>."}, {"e": "ra_db", "t": "The story, its taggings and the vote are saved in one transaction; links in the text are recorded."}, {"e": "st_qu", "t": "\u003ccode>CreateStoryCardJob\u003c/code> is queued now, \u003ccode>SendWebmentionJob\u003c/code> with a 5-minute wait, and the member is redirected to the new story."}, {"e": "qu_en", "t": "The worker runs the card job: one job per story at a time."}, {"e": "en_si", "t": "It reads the page's card image and saves a PNG; minutes later the webmention job finds the site's endpoint, if any, and posts the story's URL to it."}]}, "emailreply": {"title": "A mailing-list member replies by email", "hue": "background", "desc": "Answering a mailing-list email posts a comment, through Postfix and Action Mailbox. The script that sends those emails is currently disabled in cron.", "hops": [{"e": "me_po", "t": "Mailing-list emails carry \u003ccode>Reply-To: &lt;shortname&gt;-&lt;mailing list token&gt;@\u003c/code> the site's domain, so the member's reply goes there."}, {"e": "po_mb", "t": "Postfix pipes it to \u003ccode>script/lobsters-ingress\u003c/code>, which posts it to \u003ccode>/rails/action_mailbox/relay/inbound_emails\u003c/code> with the ingress password. A failure exits 75 so Postfix retries."}, {"e": "mb_ra", "t": "\u003ccode>InboxMailbox\u003c/code> finds the member by token and the parent comment or story from \u003ccode>In-Reply-To\u003c/code>, takes the plain-text part, strips the signature and quoted text, and saves a comment marked \u003ccode>is_from_email\u003c/code>. Anything unmatched bounces."}, {"e": "ra_db", "t": "The comment's own callbacks record its first vote and update the story's counts, as for a comment posted on the site."}]}}, "buildSteps": [null, {"title": "A list of links", "text": "A Rails app on SQLite with stories, a front page ordered by hotness, and Caddy in front.", "decision": "Hotness is stored on the row and recomputed on writes, so the front page is an ORDER BY on an index.", "runnable": "bin/setup && bin/dev", "nodes": ["visitor", "caddy", "pipeline", "feeds", "primary"]}, {"title": "Members and votes", "text": "Logins, story submission, and votes that move a story's score and hotness.", "decision": "Score and flags are recounted from the votes table in one UPDATE instead of incremented.", "nodes": ["member", "stories", "ranking", "sites"]}, {"title": "Serve pages from disk", "text": "Write anonymous pages to files that Caddy serves, and a job queue that rebuilds them after every change.", "decision": "Refill the file with a job instead of deleting it, so a visitor never waits for a render.", "runnable": "bin/jobs", "nodes": ["pagefiles", "pagecache", "queue", "recurring"]}, {"title": "Comments and notifications", "text": "Threaded comments, and a job that tells the people being answered.", "decision": "Notify in the worker so posting stays fast and a failed email loses nothing.", "nodes": ["comments", "notify", "pushover"]}, {"title": "Search, previews and caching", "text": "FTS5 search, link previews and webmentions, and a cache database for lists and throttling.", "decision": "Stay inside SQLite: full-text search, cache and rate-limit counters are all tables.", "nodes": ["search", "enrich", "cache"]}, {"title": "Keep it civil", "text": "Moderation tools and a bot filter in front of Rails.", "decision": "Moderators act in the app and every action is logged in public.", "nodes": ["moderator", "modtools", "anubis"]}, {"title": "Mail in and out", "text": "Postfix on the host sends mail and turns replies into comments.", "decision": "Run the mail server on the same box rather than depend on a mail API.", "nodes": ["postfix", "mailbox"]}, {"title": "Reach the fediverse", "text": "Cron scripts that post front-page stories to Mastodon and sweep the page cache.", "decision": "Leave the old cron scripts alone while new schedules go in recurring.yml.", "nodes": ["cron", "mastodon"]}], "tourChapters": [{"name": "Context", "hue": "--ink"}, {"name": "Reading", "hue": "--h-component"}, {"name": "Writing", "hue": "--h-component"}, {"name": "Background", "hue": "--h-background"}, {"name": "Recap", "hue": "--ink"}], "tour": [{"ch": 0, "level": 0, "title": "A community site on one server", "body": ["Lobsters is a link aggregator: members submit links, vote and discuss them in threads, and moderators keep it on topic.", "It runs as one Rails app on one VPS, with SQLite for data, cache and queue, and Caddy in front."], "why": "The README is explicit: few moving parts, almost no external services, self-hosted from the VPS up. Everything on this map follows from that."}, {"ch": 1, "flow": "frontpage", "hops": [0, 2], "title": "Most reads are files", "body": ["A logged-out visitor with no app cookie gets a page Caddy reads from disk."], "why": "Rails is never involved in a cache hit, which is how a small server handles a busy site."}, {"ch": 1, "flow": "frontpage", "hops": [2, 8], "title": "A miss renders and writes the file", "body": ["On a miss the request goes through Anubis to Rails, the story list comes from a 45-second cache or the database, and the rendered page is written to disk."], "why": "Rails clears the session cookie for anonymous visitors so their next request stays on the cached path."}, {"ch": 2, "flow": "upvote", "hops": [0, 6], "title": "A vote recounts the story", "body": ["The vote row is saved, karma moves, and one SQL statement recounts score and flags and stores the new hotness."], "why": "Recounting from the votes table instead of adding one keeps the score correct even when a flag stops counting because its author commented."}, {"ch": 2, "flow": "upvote", "hops": [6, 10], "title": "Then the page is rebuilt", "body": ["A job renders the story page as an anonymous visitor would see it and writes the file Caddy serves."], "why": "The old file stays in place until the new one is ready, so nobody ever waits for a render."}, {"ch": 2, "flow": "submit", "title": "Submitting a story", "body": ["The URL is fetched for a title, the story is saved with its first vote and hotness, and two jobs reach back out to the site."], "why": "Every fetch of a user-supplied URL goes through Sponge, which refuses private IP addresses."}, {"ch": 3, "flow": "comment", "title": "A reply finds its reader", "body": ["The comment is saved in the request; the worker writes notifications and sends email and pushes."], "why": "The request returns as soon as the comment is saved; mail and push failures happen in the worker, out of the member's way."}, {"ch": 3, "flow": "emailreply", "title": "Replying by email", "body": ["Postfix hands a reply to a mailing-list email to Action Mailbox, which saves it as a comment."], "why": "The reply's \u003ccode>In-Reply-To\u003c/code> header names the comment or story it answers; the address's token names the member. Note that the mailing-list sender is commented out in cron."}, {"ch": 4, "whole": true, "title": "The whole site, on one map", "recap": {"people": "Visitors read, members post and vote, moderators keep order.", "front": "Caddy serves cached pages, Anubis filters bots, Postfix handles mail.", "pages": "Story lists and search, written to disk for logged-out readers.", "write": "Stories, comments and votes; the models keep score and hotness.", "background": "Solid Queue jobs and cron: notify, refill, preview, post.", "storage": "Four SQLite files: data, cache, throttle counters and queue.", "outside": "Linked sites, Mastodon and Pushover, all over HTTPS."}, "body": ["One Rails codebase run as a web server and a job worker, sharing SQLite files on one disk.", "The idea that shapes it: logged-out pages are files, and every write ends by rebuilding the file it changed."]}], "insides": {"ranking": {"kind": "steps", "title": "Inside a vote", "sub": "What \u003ccode>Vote.vote_thusly_on_story_or_comment_for_user_because\u003c/code> does with one click, then how the story recounts itself.", "cap": "The score is not incremented: it is recounted from the votes table in the same UPDATE that stores the new hotness. Flags from members who commented on the story are left out of both score and flag count.", "steps": [{"t": "Find or start the vote", "d": "One row per member per story (or comment).", "code": "app/models/vote.rb:112-113"}, {"t": "Load the story first", "d": "Avoids a rare deadlock with a story being created at the same moment.", "code": "app/models/vote.rb:115-121"}, {"t": "Same vote as before?", "code": "app/models/vote.rb:123", "exit": {"when": "no change", "t": "Nothing to do"}}, {"t": "Work out the deltas", "d": "Score moves only on upvotes; flags move only on flags.", "code": "app/models/vote.rb:125-148"}, {"t": "Save or delete the vote", "d": "Unvoting deletes the row.", "code": "app/models/vote.rb:150-156"}, {"t": "Move the author's karma", "d": "Not when voting on your own story.", "code": "app/models/vote.rb:158-162"}, {"t": "Recount score and flags", "d": "One UPDATE with subqueries over votes, plus the new hotness.", "code": "app/models/story.rb:730-755"}, {"t": "Compute hotness", "d": "Tag modifiers, log of score plus capped comment points, and the creation time divided by a window: newer stories sort first.", "code": "app/models/story.rb:590-620"}]}, "pagecache": {"kind": "steps", "title": "Inside the page cache refill", "sub": "From \u003ccode>refill_story_page_cache\u003c/code> in the controller to \u003ccode>CachePageJob\u003c/code> writing the file.", "cap": "Old stories go on a separate \u003ccode>refill_story_pages\u003c/code> queue served by one worker, so rebuilding thousands of pages after a deploy never delays a fresh story's refill.", "steps": [{"t": "Every story write asks for a refill", "d": "An \u003ccode>after_action\u003c/code> on create, vote, flag, edit and delete.", "code": "app/controllers/stories_controller.rb:19-21"}, {"t": "Story gone or merged?", "code": "app/controllers/application_controller.rb:126-129", "exit": {"when": "deleted", "t": "Remove its cached files"}}, {"t": "Already queued in the last 2 minutes?", "code": "app/controllers/application_controller.rb:131-132", "exit": {"when": "debounced", "t": "Skip; mod actions bypass this"}}, {"t": "Queue the render", "d": "Recent stories on \u003ccode>default\u003c/code>, older ones on \u003ccode>refill_story_pages\u003c/code>.", "code": "app/controllers/application_controller.rb:134-138", "async": true}, {"t": "One job per path", "d": "A second job for the same path is discarded.", "code": "app/jobs/cache_page_job.rb:3"}, {"t": "Render as a visitor", "d": "An in-process HTTPS GET with no session.", "code": "app/jobs/cache_page_job.rb:6-10"}, {"t": "Not a 200?", "code": "app/jobs/cache_page_job.rb:11-12", "exit": {"when": "error", "t": "Raise on 5xx, skip others"}}, {"t": "Write the file", "d": "Through the patched writer: temp file, then rename.", "code": "app/jobs/cache_page_job.rb:14"}, {"t": "Remove old slugs", "d": "A retitled story leaves files under its old slug.", "code": "app/jobs/cache_page_job.rb:16-23"}]}, "comments": {"kind": "steps", "title": "Inside posting a comment", "sub": "\u003ccode>CommentsController#create\u003c/code>, in order. Early exits branch to the right.", "cap": "Everything slow, telling the people being answered and rebuilding the story page, is queued; the request ends after the save.", "steps": [{"t": "Find the story", "code": "app/controllers/comments_controller.rb:19-22", "exit": {"when": "gone", "t": "400 can't find story"}}, {"t": "Build the comment", "d": "Text, author and an optional hat.", "code": "app/controllers/comments_controller.rb:24-27"}, {"t": "Parent in the same story?", "code": "app/controllers/comments_controller.rb:29-36", "exit": {"when": "invalid", "t": "Error: invalid parent"}}, {"t": "Same text posted already?", "d": "Slow connections resubmit.", "code": "app/controllers/comments_controller.rb:38-45", "exit": {"when": "duplicate", "t": "Show the existing comment"}}, {"t": "Over the speed limit?", "code": "app/controllers/comments_controller.rb:47-50", "exit": {"when": "too fast", "t": "Show the form again"}}, {"t": "Save", "d": "After commit: first upvote, story counts and hotness, hotspot index.", "code": "app/models/comment.rb:40-45"}, {"t": "Touch the thread", "d": "\u003ccode>last_comment_at\u003c/code> on the story, \u003ccode>last_reply_at\u003c/code> on the parent.", "code": "app/controllers/comments_controller.rb:54-57"}, {"t": "Queue notifications", "code": "app/controllers/comments_controller.rb:58", "async": true, "exit": {"when": "later", "t": "Worker emails and pushes", "code": "app/jobs/notify_comment_job.rb:66-90"}}, {"t": "Return the comment", "d": "A partial for the page's script, or a redirect.", "code": "app/controllers/comments_controller.rb:460-467"}]}, "primary": {
