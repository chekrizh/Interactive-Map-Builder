</head><body><div id="app"></div><script type="application/json" id="map-definition">{"id": "rivet-db-extract", "page": {"title": "Rivet: database to warehouse, mapped", "slots": {"overviewDescription": "Rivet in context: who runs it, the databases it reads, the bucket it writes and the warehouses it loads.", "mapDescription": "The modules of the rivet binary, the state store and the outside systems, with the paths a batch export, a change capture, a warehouse load and a verification take.", "completionIntro": "You followed one batch export from the command line to a manifest in the bucket, watched a change stream acknowledge only what was durable, and loaded the result into a warehouse behind a count gate.", "completionLessons": "\u003cli>Why parts land first, the manifest second and the cursor last\u003c/li>\u003cli>Why a change is acknowledged at the source only after its part and manifest are durable\u003c/li>\u003cli>How \u003ccode>rivet load\u003c/code> trusts manifests and a row count, not whatever sits in the bucket\u003c/li>\u003cli>Where the state database fits: leases, ledgers and resume points\u003c/li>"}}, "panels": {"introHtml": "\u003cdiv class=\"p-eyebrow\">Start here\u003c/div>\u003ch2>Rivet, a production-database extractor\u003c/h2>\u003cp style=\"margin-top:8px\">A map of \u003ca href=\"https://github.com/rivet-lab/rivet\">rivet-lab/rivet\u003c/a> in C4 terms. Rivet is one Rust command line tool: it reads PostgreSQL, MySQL, SQL Server, MongoDB or Oracle, writes Parquet or CSV to local disk, S3, GCS or Azure, and can load the result into BigQuery, Snowflake or ClickHouse.\u003c/p>\u003cp>\u003csmall>Rivet is made by the Rivet contributors and released under the \u003ca href=\"https://github.com/rivet-lab/rivet/blob/9ee7deaf93a3c344778f2434856e4bffc3b23385/LICENSE\">MIT licence\u003c/a>. This map describes it in its own words and is not affiliated with its authors.\u003c/small>\u003c/p>\u003ch3>Try it\u003c/h3>\u003cul class=\"newlist\">\u003cli>Open a card to see that part of the tool.\u003c/li>\u003cli>Play \u003cb>Batch export\u003c/b>: the order of the writes is the design.\u003c/li>\u003cli>Click a component for what it does and which files hold it.\u003c/li>\u003c/ul>\u003cdiv class=\"panel-actions\">\u003cbutton type=\"button\" class=\"panel-action\" id=\"gofull\">Open full map\u003c/button>\u003c/div>", "overviewHtml": "\u003cdiv class=\"p-eyebrow\">The full map\u003c/div>\u003ch2>One binary, three outside worlds\u003c/h2>\u003cp style=\"margin-top:8px\">There is no server: every box inside the system boundary is a module of the \u003ccode>rivet\u003c/code> binary, run once per command by cron, Airflow or a person. What survives between runs is the state database and the files in the bucket.\u003c/p>\u003ch3>How to read it\u003c/h3>\u003cp>People on the left, then the command layer, the batch and change-capture pipelines, the commit seam and state, and the warehouse loader. Source databases, the bucket, the warehouses and Slack are outside the boundary.\u003c/p>\u003cp>A second small binary, \u003ccode>rivet-mcp\u003c/code>, gives an AI agent read-only diagnostics on the source.\u003c/p>"}, "groups": {"people": {"title": "Operators and agents", "huekey": "person", "icon": "users", "line1": "People or a scheduler run it.", "line2": "Agents ask about the source.", "chips": "cron · Airflow · MCP", "text": "Rivet runs as a command you schedule, not a hosted service. A data engineer writes rivet.yaml and a scheduler runs the commands; an AI agent can query source health through rivet-mcp.", "members": ["operator", "agent"]}, "sources": {"title": "Source databases", "huekey": "external", "icon": "database", "line1": "Production databases,", "line2": "read without hurting them.", "chips": "PostgreSQL · MySQL · MongoDB", "text": "The operational databases rivet extracts from: by SQL reads for batch exports, and by their change logs for change data capture.", "members": ["srcdb"]}, "command": {"title": "Commands and plans", "huekey": "component", "icon": "square-terminal", "line1": "Parse, validate, plan", "line2": "before anything is read.", "chips": "clap · rivet.yaml · plans", "text": "The command line, the YAML config, the plan that turns an export into a concrete strategy, the init and doctor commands, and the separate MCP binary.", "members": ["cli", "config", "planner", "preflight", "mcp"]}, "batch": {"title": "Batch extract", "huekey": "component", "icon": "table", "line1": "Rows to Arrow batches", "line2": "to Parquet or CSV parts.", "chips": "snapshot · chunked · keyset", "text": "The export runner and its strategies, the per-engine source drivers and the sink that streams Arrow batches into temporary Parquet or CSV files.", "members": ["runner", "strategies", "drivers", "sink"]}, "cdc": {"title": "Change capture", "huekey": "component", "icon": "git-branch", "line1": "Inserts, updates, deletes", "line2": "from the database's log.", "chips": "slot · binlog · change tables", "text": "One change stream per engine and the capture sink that writes typed change parts and acknowledges the source only after they are durable.", "members": ["cdcstream", "cdcsink"]}, "durable": {"title": "Commit and proof", "huekey": "store", "icon": "shield-check", "line1": "Parts, manifest, state,", "line2": "and checks after the fact.", "chips": "manifest · SQLite", "text": "The commit seam that uploads parts and writes the manifest, the destination backends, the state database, and the validate, reconcile and repair commands that check what landed.", "members": ["commit", "destinations", "state", "verify"]}, "load": {"title": "Warehouse load", "huekey": "component", "icon": "warehouse", "line1": "Manifests in, tables out,", "line2": "behind a count gate.", "chips": "rivet load · rivet compact", "text": "The load driver that turns successful runs into warehouse tables, one adapter per warehouse, and the compact command that folds a change buffer into its base table.", "members": ["loaddriver", "adapters", "compact"]}, "outside": {"title": "Storage and warehouses", "huekey": "external", "icon": "cloud", "line1": "Where the files land", "line2": "and where they end up.", "chips": "S3 · GCS · BigQuery", "text": "The object store or local folder that holds the exported parts, the warehouses rivet loads, and the Slack webhook it notifies.", "members": ["bucket", "warehouse", "slack"]}}, "overview": [{"g": "people"}, {"g": "command"}, {"g": "batch"}, {"g": "cdc"}, {"g": "sources"}, {"g": "durable"}, {"g": "load"}, {"g": "outside"}], "overviewEdges": [{"id": "o1", "from": "people", "to": "command", "label": "runs commands"}, {"id": "o2", "from": "command", "to": "batch", "label": "rivet run"}, {"id": "o3", "from": "command", "to": "cdc", "label": "mode: cdc"}, {"id": "o4", "from": "command", "to": "load", "label": "rivet load"}, {"id": "o5", "from": "batch", "to": "sources", "label": "SQL reads"}, {"id": "o6", "from": "cdc", "to": "sources", "label": "reads the log"}, {"id": "o7", "from": "batch", "to": "durable", "label": "parts"}, {"id": "o8", "from": "cdc", "to": "durable", "label": "change parts"}, {"id": "o9", "from": "durable", "to": "outside", "label": "writes files"}, {"id": "o10", "from": "load", "to": "outside", "label": "loads tables"}, {"id": "o11", "from": "load", "to": "durable", "label": "ledger"}], "zones": [{"id": "z_people", "label": "People and agents", "hue": "person"}, {"id": "z_cmd", "label": "rivet binary · commands", "hue": "component"}, {"id": "z_batch", "label": "Batch extract · pipeline/ and source/", "hue": "component"}, {"id": "z_cdc", "label": "Change capture · source/cdc and pipeline/cdc", "hue": "component"}, {"id": "z_commit", "label": "Commit, state and proof", "hue": "store"}, {"id": "z_load", "label": "Warehouse load · load/", "hue": "component"}, {"id": "z_src", "label": "Source databases", "hue": "external"}, {"id": "z_out", "label": "Storage, warehouses, alerts", "hue": "external"}], "nodes": [{"id": "operator", "group": "people", "zone": "z_people", "cat": "person", "shape": "person", "step": 1, "icon": "user", "concept": "Data engineer or scheduler", "tool": "Person · cron · Airflow", "what": "Writes \u003ccode>rivet.yaml\u003c/code> (often scaffolded by \u003ccode>rivet init\u003c/code>) and runs \u003ccode>rivet run\u003c/code>, \u003ccode>rivet load\u003c/code> and \u003ccode>rivet compact\u003c/code> by hand or on a schedule.", "why": "Rivet is a command, not a platform: each invocation does one job and exits, so cron, Airflow, a Kubernetes CronJob or \u003ccode>docker run\u003c/code> can drive it.", "tools": "\u003ccode>rivet\u003c/code> binary · Homebrew, cargo or the Docker image · \u003ccode>rivet.yaml\u003c/code>"}, {"id": "agent", "group": "people", "zone": "z_people", "cat": "person", "shape": "person", "step": 7, "icon": "bot", "concept": "AI agent", "tool": "MCP client", "what": "An assistant such as Claude Desktop or Claude Code that starts \u003ccode>rivet-mcp\u003c/code> and calls its tools to look at the source before or during an extract.", "why": "Lets an agent check sessions, locks and table stats on the source without being given write access to it.", "tools": "JSON-RPC over stdio · \u003ccode>src/bin/rivet-mcp.rs\u003c/code>"}, {"id": "srcdb", "group": "sources", "zone": "z_src", "cat": "external", "shape": "external", "step": 1, "logo": "postgresql", "concept": "Source databases", "tool": "PostgreSQL · MySQL · SQL Server · MongoDB · Oracle", "what": "The production databases rivet reads. Batch exports send SQL (a server-side cursor on PostgreSQL, keyset or chunked range queries elsewhere); change capture reads a logical replication slot, the MySQL binlog, SQL Server change tables, a MongoDB change stream or Oracle LogMiner.", "why": "They are production, so rivet keeps reads short and bounded, detects connection poolers (pgBouncer, ProxySQL, the Azure SQL gateway) and measures the load it adds to the server.", "tools": "postgres · mysql · tiberius · mongodb crates · Oracle behind the \u003ccode>oracle\u003c/code> feature", "icon": "database"}, {"id": "cli", "group": "command", "zone": "z_cmd", "cat": "component", "step": 1, "icon": "square-terminal", "concept": "Command line", "tool": "Component · src/cli", "what": "Parses the arguments with clap, checks cross-flag rules, then \u003ccode>dispatch\u003c/code> matches the subcommand to its entry point: \u003ccode>run\u003c/code>, \u003ccode>cdc\u003c/code>, \u003ccode>load\u003c/code>, \u003ccode>compact\u003c/code>, \u003ccode>init\u003c/code>, \u003ccode>check\u003c/code>, \u003ccode>doctor\u003c/code>, \u003ccode>plan\u003c/code>, \u003ccode>apply\u003c/code>, \u003ccode>validate\u003c/code>, \u003ccode>reconcile\u003c/code>, \u003ccode>repair\u003c/code> and the \u003ccode>state\u003c/code> tools.", "why": "One place maps every error to an exit class and an error code, redacts credentials from the message and prints it as text or JSON, so schedulers can react to the exit status.", "tools": "\u003ccode>src/main.rs\u003c/code> · \u003ccode>src/cli/args.rs\u003c/code> · \u003ccode>src/cli/dispatch.rs\u003c/code> · clap"}, {"id": "config", "group": "command", "zone": "z_cmd", "cat": "component", "step": 1, "icon": "file-cog", "concept": "Config loader", "tool": "Component · src/config", "what": "Reads \u003ccode>rivet.yaml\u003c/code>: the source, the list of exports with their mode, query, format and destination, tuning, notifications and the \u003ccode>load:\u003c/code> block. Resolves URLs from environment variables or files and applies \u003ccode>--param\u003c/code> values.", "why": "Everything rivet does is declared here, so validation and lints run before any connection is opened.", "tools": "serde YAML · \u003ccode>src/config/mod.rs\u003c/code> · \u003ccode>src/config/export.rs\u003c/code> · \u003ccode>src/config/load.rs\u003c/code>"}, {"id": "planner", "group": "command", "zone": "z_cmd", "cat": "component", "step": 3, "icon": "route", "concept": "Run plan", "tool": "Component · src/plan", "what": "Turns one export into a \u003ccode>ResolvedRunPlan\u003c/code>: the extraction strategy (snapshot, incremental, time window, chunked, keyset), the tuning profile, column overrides and the destination. \u003ccode>rivet plan\u003c/code> seals the same plan into a file that \u003ccode>rivet apply\u003c/code> replays.", "why": "Separating the decision from the execution lets a plan be reviewed, hashed and replayed with the same chunk boundaries.", "tools": "\u003ccode>src/plan/build.rs\u003c/code> · \u003ccode>src/plan/artifact.rs\u003c/code> · \u003ccode>src/pipeline/plan_cmd.rs\u003c/code> · \u003ccode>src/pipeline/apply_cmd.rs\u003c/code>"}, {"id": "preflight", "group": "command", "zone": "z_cmd", "cat": "component", "step": 4, "icon": "stethoscope", "concept": "Init, check and doctor", "tool": "Component · src/init · src/preflight", "what": "\u003ccode>rivet init\u003c/code> reads the source catalog and writes a reviewed YAML with one export per table and a suggested mode. \u003ccode>rivet check\u003c/code> runs EXPLAIN and a type report; \u003ccode>rivet doctor\u003c/code> probes the source and destination connections.", "why": "Most failures are a wrong URL, a missing grant or a type that will not survive; finding them before the first run saves a failed production extract.", "tools": "\u003ccode>src/init/mod.rs\u003c/code> · \u003ccode>src/preflight/doctor.rs\u003c/code> · \u003ccode>src/preflight/type_report.rs\u003c/code>"}, {"id": "mcp", "group": "command", "zone": "z_cmd", "cat": "component", "step": 7, "icon": "plug", "concept": "MCP server", "tool": "Component · rivet-mcp binary", "what": "A second binary that speaks JSON-RPC 2.0 over stdin and stdout and exposes read-only tools: PostgreSQL sessions, checkpoint pressure, table stats, locks and top queries, and MySQL process list, key metrics and table stats.", "why": "Kept as its own binary rather than a subcommand, so an agent integration never pulls in the export path.", "tools": "\u003ccode>src/mcp.rs\u003c/code> · \u003ccode>src/bin/rivet-mcp.rs\u003c/code>"}, {"id": "runner", "group": "batch", "zone": "z_batch", "cat": "component", "step": 3, "icon": "play", "inside": "runner", "concept": "Export job runner", "tool": "Component · pipeline/run.rs · job.rs", "what": "\u003ccode>pipeline::run\u003c/code> selects the exports, runs them one after another, on a thread pool or as child processes, and prints the run aggregate. For each export \u003ccode>run_export_job\u003c/code> either hands a \u003ccode>mode: cdc\u003c/code> export to the capture or runs the batch plan with its gates.", "why": "This is where the ordering lives: lease, run ledger, data, manifest, cursor, metrics. A crash between any two steps leaves something resume can finish rather than a gap.", "tools": "\u003ccode>src/pipeline/run.rs\u003c/code> · \u003ccode>src/pipeline/job.rs\u003c/code> · \u003ccode>src/pipeline/parallel_children.rs\u003c/code> · \u003ccode>src/notify.rs\u003c/code>"}, {"id": "strategies", "group": "batch", "zone": "z_batch", "cat": "component", "step": 3, "icon": "split", "concept": "Extraction strategies", "tool": "Component · single · chunked · keyset", "what": "\u003ccode>run_with_reconnect\u003c/code> retries a failed attempt with backoff and a fresh connection. \u003ccode>run_export\u003c/code> then picks the loop: one query (snapshot, incremental, time window), chunked ranges with optional per-chunk checkpoints, or keyset pages.", "why": "Short, bounded reads keep a large table from holding one long transaction on production; chunk and page checkpoints let \u003ccode>--resume\u003c/code> finish a crashed run.", "tools": "\u003ccode>src/pipeline/single.rs\u003c/code> · \u003ccode>src/pipeline/chunked/\u003c/code> · \u003ccode>src/pipeline/keyset.rs\u003c/code> · \u003ccode>src/error/retry.rs\u003c/code> (error classes, re-exported as \u003ccode>pipeline::retry\u003c/code>)"}, {"id": "drivers", "group": "batch", "zone": "z_batch", "cat": "component", "step": 1, "icon": "cable", "concept": "Source drivers", "tool": "Component · Source trait · src/source", "what": "One \u003ccode>Source\u003c/code> per engine. PostgreSQL declares a cursor and fetches N rows at a time; MySQL, SQL Server, MongoDB and Oracle have their own loops. Each maps native types to a \u003ccode>RivetType\u003c/code>, converts rows to Arrow and pushes each batch to the sink. A shared batch controller sizes batches to a memory budget and throttles.", "why": "Adding an engine means implementing one trait; the rest of the pipeline only ever sees Arrow batches.", "tools": "\u003ccode>src/source/mod.rs\u003c/code> · \u003ccode>src/source/postgres/mod.rs\u003c/code> · \u003ccode>src/source/batch_controller.rs\u003c/code> · arrow"}, {"id": "sink", "group": "batch", "zone": "z_batch", "cat": "component", "step": 1, "icon": "file-stack", "concept": "Export sink and formats", "tool": "Component · pipeline/sink · src/format", "what": "Receives the schema and each Arrow batch, adds meta columns, and streams them into a temporary Parquet or CSV file. It rotates to a new part at \u003ccode>max_file_size\u003c/code> and computes per-column checksums as it goes. By default a worker thread encodes while the source thread keeps fetching.", "why": "No batch is held beyond the current fetch, so memory stays at about batch size times row width, whatever the table size.", "tools": "\u003ccode>src/pipeline/sink/mod.rs\u003c/code> · \u003ccode>src/format/parquet.rs\u003c/code> · \u003ccode>src/format/csv.rs\u003c/code>"}, {"id": "cdcstream", "group": "cdc", "zone": "z_cdc", "cat": "component", "step": 5, "icon": "radio-tower", "concept": "Change streams", "tool": "Component · ChangeStream trait", "what": "\u003ccode>create_change_stream\u003c/code> opens the engine's stream: on PostgreSQL a logical slot with the \u003ccode>test_decoding\u003c/code> plugin, polled with SQL (\u003ccode>pg_logical_slot_peek_changes\u003c/code>); the MySQL binlog; SQL Server change tables; a MongoDB change stream; Oracle LogMiner. Each yields canonical \u003ccode>ChangeEvent\u003c/code>s with an operation, table, row image and resume position.", "why": "\u003ccode>ack\u003c/code> is separate from reading: an engine that consumes on read, like a PostgreSQL slot, only moves forward once rivet says the change is stored.", "tools": "\u003ccode>src/source/cdc/mod.rs\u003c/code> · \u003ccode>src/source/postgres/cdc.rs\u003c/code> · \u003ccode>src/source/mysql/cdc.rs\u003c/code> · large transactions spill to disk · a pgoutput decoder (\u003ccode>pgoutput.rs\u003c/code>) exists but is not yet used outside tests"}, {"id": "cdcsink", "group": "cdc", "zone": "z_cdc", "cat": "component", "step": 5, "icon": "git-commit-horizontal", "inside": "cdcsink", "concept": "Capture sink", "tool": "Component · pipeline/cdc", "what": "\u003ccode>run_capture\u003c/code> resolves each captured table's columns, then \u003ccode>run_to_files\u003c/code> pulls changes, routes them to per-table buffers and rolls them into typed parts with \u003ccode>__op\u003c/code>, \u003ccode>__pos\u003c/code> and \u003ccode>__seq\u003c/code> columns. Each roll uploads and records the parts, rewrites the manifest, saves the checkpoint file and acks. The standalone \u003ccode>rivet cdc\u003c/code> command drives the same \u003ccode>run_capture\u003c/code> from a URL, without a state store.", "why": "Checkpoints sit on transaction boundaries and the ack comes last, so a crash anywhere re-reads changes instead of losing them: at-least-once. The resume position lives in a local checkpoint file (\u003ccode>cdc.checkpoint\u003c/code>, scaffolded as \u003ccode>./cdc/&lt;table&gt;.ckpt\u003c/code>), not in the state database; on PostgreSQL the slot itself also holds it.", "tools": "\u003ccode>src/pipeline/cdc/mod.rs\u003c/code> · \u003ccode>src/pipeline/cdc/sink.rs\u003c/code> · \u003ccode>src/pipeline/cdc_job.rs\u003c/code>"}, {"id": "commit", "group": "durable", "zone": "z_commit", "cat": "component", "step": 2, "icon": "stamp", "concept": "Commit seam and manifest", "tool": "Component · commit.rs · manifest_writer.rs", "what": "Uploads each sealed part, computes its xxh3 fingerprint and MD5, compares the MD5 with what the store reported, and records the part. At the end of the run it writes \u003ccode>manifest.json\u003c/code> listing every part with rows and checksums, and \u003ccode>_SUCCESS\u003c/code> when the run succeeded.", "why": "Every runner goes through the same seam, so the rule \"file first, then the record of it\" cannot drift between strategies. The manifest is what loaders trust.", "tools": "\u003ccode>src/pipeline/commit.rs\u003c/code> · \u003ccode>src/pipeline/manifest_writer.rs\u003c/code> · \u003ccode>src/pipeline/finalize.rs\u003c/code> · \u003ccode>src/manifest.rs\u003c/code>"}, {"id": "destinations", "group": "durable", "zone": "z_commit", "cat": "component", "step": 2, "icon": "hard-drive-upload", "concept": "Destination backends", "tool": "Component · Destination trait", "what": "\u003ccode>create_destination\u003c/code> builds local, stdout, S3, GCS or Azure. The cloud ones go through OpenDAL with a retry layer. Besides \u003ccode>write\u003c/code>, each can list, read and head objects so validate and resume can inspect a prefix.", "why": "A destination says how it commits (atomic, finalize on close, streaming); state is only updated once that commit is confirmed.", "tools": "\u003ccode>src/destination/mod.rs\u003c/code> · \u003ccode>src/destination/cloud.rs\u003c/code> · \u003ccode>src/destination/gcs.rs\u003c/code> · opendal"}, {"id": "state", "group": "durable", "zone": "z_commit", "cat": "store", "shape": "database", "step": 3, "logo": "sqlite", "inside": "state", "concept": "State store", "tool": "SQLite file or PostgreSQL", "what": "\u003ccode>.rivet_state.db\u003c/code> beside the config, or a PostgreSQL database when \u003ccode>RIVET_STATE_URL\u003c/code> is set. Holds incremental cursors, chunk checkpoints, the run-status ledger, the per-part file log, metrics, journals and the load ledger. The CDC resume position is not here: it is a separate checkpoint file beside the config.", "why": "Without it every run is a full reload and a crash means starting over. It is also what lets \u003ccode>rivet load\u003c/code> know which runs are already in the warehouse.", "tools": "rusqlite · postgres · \u003ccode>src/state/mod.rs\u003c/code> · \u003ccode>src/state/migrations.rs\u003c/code>", "icon": "database"}, {"id": "verify", "group": "durable", "zone": "z_commit", "cat": "component", "step": 4, "icon": "clipboard-check", "concept": "Validate, reconcile, repair", "tool": "Component · pipeline/*_cmd.rs", "what": "\u003ccode>rivet validate\u003c/code> re-reads a prefix's manifest and parts and checks counts and checksums without touching the source. \u003ccode>rivet reconcile\u003c/code> recounts each stored chunk with \u003ccode>COUNT(*)\u003c/code> on the source. \u003ccode>rivet repair --execute\u003c/code> re-exports only the chunks that differ.", "why": "A green exit code says the run finished, not that the data is right; these commands give a reason to believe the files.", "tools": "\u003ccode>src/pipeline/validate_cmd.rs\u003c/code> · \u003ccode>src/pipeline/reconcile_cmd.rs\u003c/code> · \u003ccode>src/pipeline/repair_cmd.rs\u003c/code>"}, {"id": "loaddriver", "group": "load", "zone": "z_load", "cat": "component", "step": 6, "icon": "truck", "inside": "loaddriver", "concept": "Load driver", "tool": "Component · load/orchestrate.rs", "what": "\u003ccode>rivet load\u003c/code> plans one load per export, then for each table on a worker pool: takes a table lease, reads every manifest under the prefix, picks the successful runs not yet loaded, has the adapter land them and checks the row count before cleaning anything up.", "why": "The warehouse-neutral driver owns the order and the gates, so each warehouse adapter only has to know its own SQL. A \u003ccode>load:\u003c/code> block on a destination its warehouse cannot read (anything but GCS for BigQuery and Snowflake) is refused at plan time.", "tools": "\u003ccode>src/load/orchestrate.rs\u003c/code> · \u003ccode>src/load/plan.rs\u003c/code> · \u003ccode>src/load/reconcile.rs\u003c/code> · \u003ccode>src/load/mod.rs\u003c/code>"}, {"id": "adapters", "group": "load", "zone": "z_load", "cat": "component", "step": 6, "icon": "plug-zap", "concept": "Warehouse adapters", "tool": "Component · TargetLoader trait", "what": "One \u003ccode>TargetLoader\u003c/code> per warehouse: \u003ccode>materialize\u003c/code> a table from Parquet, \u003ccode>append_changelog\u003c/code> for change data, \u003ccode>create_view\u003c/code> for the current-state view, \u003ccode>compact\u003c/code> and \u003ccode>row_count\u003c/code>. BigQuery uses its REST jobs API, Snowflake its SQL API with a key-pair JWT, ClickHouse its HTTP interface.", "why": "Every warehouse difference (external stages, partition limits, MERGE or not) stays behind this trait.", "tools": "\u003ccode>src/load/bigquery/\u003c/code> · \u003ccode>src/load/bq_rest.rs\u003c/code> · \u003ccode>src/load/snowflake.rs\u003c/code> · \u003ccode>src/load/clickhouse.rs\u003c/code>"}, {"id": "compact", "group": "load", "zone": "z_load", "cat": "component", "step": 6, "icon": "merge", "concept": "Compact", "tool": "Component · load/compact.rs", "what": "\u003ccode>rivet compact\u003c/code> merges each table's change buffer \u003ccode>&lt;table&gt;__changes\u003c/code> into its base table and drops the buffer. BigQuery uses MERGE statements, split into windows for partitioned tables; Snowflake runs a DELETE and an INSERT in one transaction.", "why": "Keeps the warehouse following the source with no full reloads. ClickHouse needs no compact step: its change log is a ReplacingMergeTree behind a view.", "tools": "\u003ccode>src/load/compact.rs\u003c/code> · runs on the same worker pool and ledger as load"}, {"id": "bucket", "group": "outside", "zone": "z_out", "cat": "external", "shape": "external", "step": 2, "logo": "googlecloudstorage", "concept": "Object store or local folder", "tool": "S3 · GCS · Azure Blob · local disk", "what": "Holds each export's prefix: the Parquet or CSV parts, named per run so a re-run never overwrites the last, plus \u003ccode>manifest.json\u003c/code> and \u003ccode>_SUCCESS\u003c/code>.", "why": "It is both the output and the hand-off to the warehouse: \u003ccode>rivet load\u003c/code> reads only what a successful manifest declares, and BigQuery and Snowflake read the parts straight from it, so a load into them needs a GCS destination.", "tools": "OpenDAL clients · credentials from the environment or files", "icon": "cloud"}, {"id": "warehouse", "group": "outside", "zone": "z_out", "cat": "external", "shape": "external", "step": 6, "logo": "googlebigquery", "concept": "Data warehouses", "tool": "BigQuery · Snowflake · ClickHouse", "what": "Where the loaded tables live: a base table per export, a \u003ccode>__changes\u003c/code> change log or buffer for change data, and a current-state view over it. BigQuery (\u003ccode>LOAD DATA\u003c/code>) and Snowflake (storage integration) read the Parquet parts from GCS themselves; for ClickHouse rivet reads each part and sends it over HTTP, from GCS, S3 or Azure.", "why": "The reason most users run rivet at all; the dataset or database must already exist, rivet does not create it.", "tools": "BigQuery jobs API · Snowflake SQL API v2 · ClickHouse HTTP", "icon": "warehouse"}, {"id": "slack", "group": "outside", "zone": "z_out", "cat": "external", "shape": "external", "step": 4, "logo": "slack", "concept": "Slack webhook", "tool": "Incoming webhook", "what": "Receives a short message with the export name, status, rows and duration when a run matches the configured events, such as a failure.", "why": "A scheduled tool that fails quietly is worse than none; the webhook URL can come from an environment variable.", "tools": "\u003ccode>src/notify.rs\u003c/code> · \u003ccode>notifications.slack\u003c/code> in the config", "icon": "message-square"}], "edges": [{"id": "op_cli", "from": "operator", "to": "cli", "label": "runs rivet"}, {"id": "ag_mcp", "from": "agent", "to": "mcp", "label": "JSON-RPC over stdio"}, {"id": "mcp_src", "from": "mcp", "to": "srcdb", "label": "read-only SQL"}, {"id": "cli_cfg", "from": "cli", "to": "config", "label": "loads rivet.yaml"}, {"id": "cli_pre", "from": "cli", "to": "preflight", "label": "init, check, doctor"}, {"id": "pre_src", "from": "preflight", "to": "srcdb", "label": "catalog probes"}, {"id": "cli_run", "from": "cli", "to": "runner", "label": "rivet run"}, {"id": "run_plan", "from": "runner", "to": "planner", "label": "builds plan"}, {"id": "run_str", "from": "runner", "to": "strategies", "label": "runs strategy"}, {"id": "str_drv", "from": "strategies", "to": "drivers", "label": "Source::export"}, {"id": "drv_src", "from": "drivers", "to": "srcdb", "label": "FETCH over SQL"}, {"id": "drv_sink", "from": "drivers", "to": "sink", "label": "Arrow batches"}, {"id": "sink_com", "from": "sink", "to": "commit", "label": "sealed parts"}, {"id": "com_dest", "from": "commit", "to": "destinations", "label": "write"}, {"id": "dest_bkt", "from": "destinations", "to": "bucket", "label": "PUT via OpenDAL"}, {"id": "com_state", "from": "commit", "to": "state", "label": "file log"}, {"id": "run_state", "from": "runner", "to": "state", "label": "lease, cursor, metrics"}, {"id": "run_slack", "from": "runner", "to": "slack", "label": "HTTPS webhook"}, {"id": "run_cdc", "from": "runner", "to": "cdcsink", "label": "run_capture"}, {"id": "cdc_str", "from": "cdcsink", "to": "cdcstream", "label": "next_change, ack"}, {"id": "str_src", "from": "cdcstream", "to": "srcdb", "label": "reads the change log"}, {"id": "cdc_dest", "from": "cdcsink", "to": "destinations", "label": "parts, manifest"}, {"id": "cdc_state", "from": "cdcsink", "to": "state", "label": "records parts"}, {"id": "cli_load", "from": "cli", "to": "loaddriver", "label": "rivet load"}, {"id": "cli_comp", "from": "cli", "to": "compact", "label": "rivet compact"}, {"id": "load_state", "from": "loaddriver", "to": "state", "label": "lease, load ledger"}, {"id": "load_bkt", "from": "loaddriver", "to": "bucket", "label": "reads manifests"}, {"id": "load_ad", "from": "loaddriver", "to": "adapters", "label": "TargetLoader"}, {"id": "comp_ad", "from": "compact", "to": "adapters", "label": "compact()"}, {"id": "ad_wh", "from": "adapters", "to": "warehouse", "label": "SQL over HTTPS"}, {"id": "cli_ver", "from": "cli", "to": "verify", "label": "validate, reconcile"}, {"id": "ver_dest", "from": "verify", "to": "destinations", "label": "reads parts"}, {"id": "ver_state", "from": "verify", "to": "state", "label": "chunk counts"}, {"id": "ver_src", "from": "verify", "to": "srcdb", "label": "COUNT(*) per chunk"}, {"id": "ver_str", "from": "verify", "to": "strategies", "label": "repair re-export"}, {"id": "bkt_wh", "from": "bucket", "to": "warehouse", "label": "LOAD DATA from GCS"}, {"id": "cli_cdc", "from": "cli", "to": "cdcsink", "label": "rivet cdc"}], "flows": {"batch": {"title": "Batch export", "hue": "component", "desc": "One rivet run of a snapshot or incremental export: rows become Arrow batches, then Parquet parts, then a manifest, and only then is the cursor moved.", "hops": [{"e": "op_cli", "t": "A scheduler runs \u003ccode>rivet run -c rivet.yaml\u003c/code>. \u003ccode>run_binary\u003c/code> installs a logger that redacts passwords and hands the parsed command to \u003ccode>dispatch\u003c/code>."}, {"e": "cli_cfg", "t": "\u003ccode>dispatch_run\u003c/code> parses the \u003ccode>--param\u003c/code> values and the config is loaded with them; \u003ccode>RunSet\u003c/code> picks the exports to run."}, {"e": "cli_run", "t": "\u003ccode>pipeline::run\u003c/code> decides how to run the exports: one after another, on threads, or as child processes. It opens the state database first so its migrations run once."}, {"e": "run_plan", "t": "For each export, \u003ccode>build_plan_on\u003c/code> resolves the plan: the strategy, the tuning profile and the destination."}, {"e": "run_state", "t": "\u003ccode>execute_resolved_plan\u003c/code> claims a run lease so two runs of one export cannot overlap, and writes a \u003ccode>running\u003c/code> row to the run-status ledger."}, {"e": "run_str", "t": "\u003ccode>run_with_reconnect\u003c/code> opens a source connection and calls \u003ccode>run_export\u003c/code>; a transient failure retries with backoff, a closed port fails at once with a pointer to \u003ccode>rivet doctor\u003c/code>."}, {"e": "str_drv", "t": "A single-query strategy builds an \u003ccode>ExportRequest\u003c/code> with the query and, for incremental, the stored cursor, and calls \u003ccode>Source::export\u003c/code>."}, {"e": "drv_src", "t": "PostgreSQL: inside a transaction, a server-side cursor and \u003ccode>FETCH\u003c/code> of N rows at a time. The batch size adapts to a memory budget and the loop can sleep between fetches."}, {"e": "drv_sink", "t": "Each batch is converted to Arrow and pushed to the sink. By default a worker thread encodes Parquet while the source thread fetches the next batch."}, {"e": "sink_com", "t": "When the source is drained the writer is finished. Parts rotated at \u003ccode>max_file_size\u003c/code> and the last temp file are handed to \u003ccode>write_sink_parts\u003c/code>."}, {"e": "com_dest", "t": "\u003ccode>write_part_file\u003c/code> uploads each part, then computes its fingerprint and MD5. If the store reported its own checksum and it differs, the run stops: the part corrupted in transit."}, {"e": "dest_bkt", "t": "OpenDAL writes the object to S3, GCS or Azure, or the file lands in a local folder. Part names carry the run, so a re-run never overwrites the previous one."}, {"e": "com_state", "t": "\u003ccode>record_part\u003c/code> adds the part to the run's manifest list and to the file log in the state database."}, {"e": "com_dest", "t": "\u003ccode>finalize_manifest\u003c/code> writes \u003ccode>manifest.json\u003c/code> with every part, row count and checksum, then \u003ccode>_SUCCESS\u003c/code> if the run succeeded."}, {"e": "run_state", "t": "\u003ccode>store_journal\u003c/code> saves the run journal and the run-status row is closed. Only then is the incremental cursor advanced, and only if the run succeeded with a manifest; a crash before it re-exports the window instead of skipping it. The metrics row comes last."}, {"e": "run_slack", "t": "If notifications are configured and the outcome matches, a short message goes to the Slack webhook."}]}, "cdc": {"title": "Change capture run", "hue": "component", "desc": "A mode: cdc export drains the database's change log to its current end, writing typed change parts and acknowledging the source only after each part is durable.", "hops": [{"e": "op_cli", "t": "The same \u003ccode>rivet run\u003c/code>, on a config whose export has \u003ccode>mode: cdc\u003c/code>. The first run takes a baseline snapshot through the batch path; later runs only read changes."}, {"e": "cli_run", "t": "\u003ccode>run_export_job\u003c/code> sees the CDC mode and takes the capture branch instead of the batch plan."}, {"e": "run_state", "t": "A CDC run lease in the state store keeps two runs of the export apart. The checkpoint is claimed by an owner file (\u003ccode>&lt;checkpoint&gt;.owner\u003c/code>) beside the checkpoint file, which stops two configs, each with its own state database, from reading the same stream."}, {"e": "run_cdc", "t": "\u003ccode>run_cdc_export\u003c/code> fills a \u003ccode>CdcCapture\u003c/code> with one output per captured table and calls \u003ccode>run_capture\u003c/code>."}, {"e": "cdc_str", "t": "\u003ccode>create_change_stream\u003c/code> opens the engine's stream from its last position. Tables whose log would carry only partial row images are refused before anything is read."}, {"e": "str_src", "t": "The stream reads the log: on PostgreSQL a \u003ccode>test_decoding\u003c/code> slot polled with \u003ccode>pg_logical_slot_peek_changes\u003c/code>, the binlog on MySQL, change tables on SQL Server, a change stream on MongoDB, LogMiner on Oracle."}, {"e": "cdc_str", "rev": true, "t": "\u003ccode>next_change\u003c/code> yields canonical changes. The sink routes each to its table's buffer and remembers the last transaction boundary it saw."}, {"e": "cdc_dest", "t": "When the buffers are big enough, \u003ccode>roll_all\u003c/code> encodes each table's part and uploads it, one worker per table."}, {"e": "dest_bkt", "t": "The parts land in the table's prefix."}, {"e": "cdc_state", "t": "Each part is recorded in the state database right after its upload, even if a sibling table's upload failed, so a failed run still says what it captured."}, {"e": "cdc_dest", "t": "At a transaction boundary the run's manifest is rewritten to cover every part so far, still without \u003ccode>_SUCCESS\u003c/code>; the terminal write at a clean end adds it."}, {"e": "cdc_str", "t": "Only now: save the checkpoint file at the last commit boundary, then \u003ccode>ack\u003c/code>. On PostgreSQL this is what lets the slot move past the changes; a crash before it re-reads them."}]}, "load": {"title": "Load the warehouse", "hue": "component", "desc": "rivet load reads the manifests under each export's prefix, lands the runs not yet loaded and refuses to clean up unless the warehouse holds exactly the rows the manifests declare.", "hops": [{"e": "op_cli", "t": "After \u003ccode>rivet run\u003c/code>, the scheduler runs \u003ccode>rivet load -c cdc.yaml\u003c/code>."}, {"e": "cli_load", "t": "\u003ccode>run_loads\u003c/code> plans one load per export from the config and picks one run id for the whole invocation, used as a cost label in the warehouse."}, {"e": "load_state", "t": "Each worker takes a lease on its target table, so two loads cannot append the same runs twice, and reads the load ledger."}, {"e": "load_bkt", "t": "\u003ccode>prepare_load\u003c/code> reads every \u003ccode>manifest.json\u003c/code> under the prefix, refuses foreign or failed runs and runs whose parts are no longer listed under the prefix, and keeps the successful runs not yet loaded."}, {"e": "load_ad", "t": "The adapter for the target is built. A full export is materialized as a table; a CDC or incremental export is appended to \u003ccode>&lt;table&gt;__changes\u003c/code>."}, {"e": "ad_wh", "t": "BigQuery runs a query job through its REST API, Snowflake a SQL script through the SQL API, ClickHouse an \u003ccode>INSERT … FORMAT Parquet\u003c/code> per part."}, {"e": "bkt_wh", "t": "BigQuery and Snowflake pull the Parquet parts straight from the GCS prefix; the data does not pass through rivet. (ClickHouse is the exception: rivet reads each part and sends it.)"}, {"e": "ad_wh", "rev": true, "t": "The landed row count is read back from the target. \u003ccode>check_loaded_rows\u003c/code> compares it with the rows the manifests declared; on a mismatch the load fails and nothing is cleaned up."}, {"e": "load_bkt", "t": "Only after the gate passes, and only if \u003ccode>cleanup_source\u003c/code> is on and no run is still writing there, the loaded parts are removed from the prefix."}, {"e": "load_state", "t": "The load is recorded in \u003ccode>load_run\u003c/code> and each source run in \u003ccode>loaded_source_run\u003c/code>, so the next load skips them."}, {"e": "cli_comp", "t": "On a base-and-buffer layout the scheduler then runs \u003ccode>rivet compact\u003c/code>."}, {"e": "comp_ad", "t": "\u003ccode>run_compacts\u003c/code> calls the adapter's \u003ccode>compact\u003c/code> for each table."}, {"e": "ad_wh", "t": "BigQuery merges the buffer into the base with MERGE statements, split into windows for partitioned tables; Snowflake runs a DELETE and an INSERT in one transaction. Then the buffer is dropped."}]}, "verify": {"title": "Prove what landed", "hue": "store", "desc": "Between runs, validate re-reads the files, reconcile recounts the source chunk by chunk, and repair re-exports only the chunks that differ.", "hops": [{"e": "op_cli", "t": "An operator or a CI job runs \u003ccode>rivet validate\u003c/code> on an export."}, {"e": "cli_ver", "t": "The validate command expands the export's destination and runs the same manifest checks as \u003ccode>rivet run --validate\u003c/code>, with no source query and no state writes."}, {"e": "ver_dest", "t": "It reads \u003ccode>manifest.json\u003c/code> and the parts through the destination backend and checks that every part is there with its rows and checksums."}, {"e": "dest_bkt", "t": "The reads go to the same prefix the run wrote: a missing or changed part shows up here."}, {"e": "ver_state", "t": "\u003ccode>rivet reconcile\u003c/code> works on chunked exports with checkpoints: it lists the stored chunk tasks of the last run with their row counts."}, {"e": "ver_src", "t": "For each chunk it runs \u003ccode>SELECT COUNT(*)\u003c/code> over the chunk's query on the source and reports matches and mismatches."}, {"e": "ver_str", "t": "\u003ccode>rivet repair --execute\u003c/code> re-runs just the mismatched ranges through the chunked runner. The new files sit beside the originals; nothing is deleted or overwritten."}]}}, "buildSteps": [null, {"title": "A query to a local file", "text": "Parse the command and the YAML, connect to one database, stream rows as Arrow batches into a Parquet file.", "decision": "Everything downstream sees Arrow batches; each engine only has to produce them.", "runnable": "rivet run -c rivet.yaml", "nodes": ["operator", "srcdb", "cli", "config", "drivers", "sink"]}, {"title": "Parts and a manifest in a bucket", "text": "Upload each part through one commit seam and finish the run with manifest.json and _SUCCESS.", "decision": "File first, then the record of it: a crash leaves an unlisted part, never a listed part that is missing.", "nodes": ["commit", "destinations", "bucket"]}, {"title": "Plans, strategies and state", "text": "Resolve each export to a strategy, run it with retries, and keep cursors, checkpoints and the run ledger in SQLite.", "decision": "The cursor moves only after the manifest is written, so an incremental run never skips rows it did not land.", "runnable": "rivet run -c rivet.yaml --resume", "nodes": ["runner", "planner", "strategies", "state"]}, {"title": "Checks before and after", "text": "Scaffold and probe before the first run; validate, reconcile and repair after it; tell Slack when something fails.", "decision": "Verification commands read the destination and the source again instead of trusting the run's own report.", "runnable": "rivet doctor -c rivet.yaml", "nodes": ["preflight", "verify", "slack"]}, {"title": "Change data capture", "text": "Read each engine's change log as canonical events and write them as typed change parts.", "decision": "Acknowledge the source last, after part, manifest and checkpoint: at-least-once instead of maybe-lost.", "nodes": ["cdcstream", "cdcsink"]}, {"title": "Into the warehouse", "text": "Load the runs a manifest declares, check the landed row count, then clean up; compact change buffers into base tables.", "decision": "A warehouse-neutral driver owns the gates; each adapter only knows its own SQL and API.", "runnable": "rivet load -c cdc.yaml && rivet compact -c cdc.yaml", "nodes": ["loaddriver", "adapters", "compact", "warehouse"]}, {"title": "Diagnostics for agents", "text": "A separate stdio binary exposes read-only source diagnostics as MCP tools.", "decision": "A separate binary, so an agent integration never links in the write path.", "runnable": "rivet-mcp --stdio", "nodes": ["agent", "mcp"]}], "tourChapters": [{"name": "Context", "hue": "--ink"}, {"name": "Batch export", "hue": "--h-component"}, {"name": "Change capture", "hue": "--h-component"}, {"name": "Warehouse", "hue": "--h-component"}, {"name": "Proof", "hue": "--h-store"}, {"name": "Recap", "hue": "--ink"}], "tour": [{"ch": 0, "level": 0, "title": "One binary between production and the warehouse", "body": ["Rivet copies tables from an operational database into files, and optionally into a warehouse. It runs as a command and exits; there is no server.", "People and an AI agent on one side, the source databases, the bucket and the warehouses on the other, and in between five parts of one Rust binary."], "why": "The source is production and the result has to be trusted, so most of the design is about the order of writes and the evidence each run leaves behind."}, {"ch": 1, "flow": "batch", "hops": [0, 8], "title": "From a command to rows", "body": ["Follow one export from the command line through the plan and the retry loop to a cursor on the source."], "why": "Leases and the run ledger are taken before any row is read, so a second scheduler tick cannot run the same export twice."}, {"ch": 1, "flow": "batch", "hops": [8, 16], "title": "Parts first, cursor last", "body": ["Batches become Parquet parts, parts become objects, objects are listed in a manifest, and only then does the cursor move."], "why": "A crash at any point leaves either data with no record, which resume picks up, or nothing; never a record that skips data."}, {"ch": 2, "flow": "cdc", "title": "Changes, acknowledged when durable", "body": ["A CDC run drains the log to its current end, rolling buffered changes into typed parts."], "why": "On PostgreSQL the ack moves the slot for good, so it has to come after the part, the manifest and the checkpoint."}, {"ch": 3, "flow": "load", "title": "Into the warehouse, behind a count gate", "body": ["rivet load reads manifests, not the bucket listing, and compares the landed rows with what the manifests declare."], "why": "A typo'd prefix or a half-written run would otherwise load silently; here it is refused before anything is cleaned up."}, {"ch": 4, "flow": "verify", "title": "Proof after the fact", "body": ["Validate, reconcile and repair check the files and the source again, independently of the run that wrote them."], "why": "These commands are why a green run can be believed: each one re-reads instead of trusting the run's own numbers."}, {"ch": 5, "whole": true, "title": "The whole tool, on one map", "recap": {"people": "A person or a scheduler runs the commands; an agent can ask about the source.", "command": "Parse the command and config, plan each export, scaffold and probe.", "batch": "Strategies drive source drivers; Arrow batches stream into Parquet or CSV parts.", "cdc": "Change streams per engine; parts first, ack last.", "sources": "Production databases, read in short bounded queries or through their logs.", "durable": "One commit seam, a manifest per run, a state database, and checks after the fact.", "load": "Manifests to warehouse tables behind a count gate, then compact.", "outside": "The bucket that holds the parts, the warehouses, and Slack."}, "body": ["One Rust binary run per command, with the state database and the bucket as its only memory.", "The design choice that shapes everything: each step writes its evidence before the next step is allowed to rely on it."]}], "insides": {"runner": {"kind": "steps", "title": "Inside the runner: one batch export", "sub": "What \u003ccode>execute_resolved_plan\u003c/code> in \u003ccode>src/pipeline/job.rs\u003c/code> does for one export, in order.", "cap": "The data phase is one step in the middle. Everything after it decides what the run may claim: the manifest is written before the cursor moves, and the result is failed if any gate (validate, reconcile, cursor) failed, even when the data landed.", "steps": [{"t": "Check the plan can run", "d": "A partitioned export must already be expanded; a MongoDB collection is bound to its incarnation.", "code": "src/pipeline/job.rs:1100-1111", "exit": {"when": "plan invalid", "t": "Failed summary, nothing read"}}, {"t": "Claim the run", "d": "Take the run lease, claim the progress row, recover an interrupted checkpoint run and refuse a stored cursor past the last manifest.", "code": "src/pipeline/job.rs:1112-1129", "exit": {"when": "another run holds it", "t": "Refused", "code": "src/pipeline/job.rs:1124-1128"}}, {"t": "Open the run in the ledger", "d": "A \u003ccode>running\u003c/code> row in \u003ccode>run_status\u003c/code>, then column and harm snapshots on a metadata connection.", "code": "src/pipeline/job.rs:1135-1143"}, {"t": "Gate the columns", "d": "Temporal settle columns, the type policy (\u003ccode>--strict\u003c/code>) and a prefix written by another pipeline shape.", "code": "src/pipeline/job.rs:1152-1156", "exit": {"when": "a gate refuses", "t": "Run fails before any read"}}, {"t": "Run the strategy", "d": "Parallel chunked with or without checkpoints, or \u003ccode>run_with_reconnect\u003c/code> for everything else.", "code": "src/pipeline/job.rs:1157-1188"}, {"t": "Finalize the export", "d": "On success, schema drift and quality checks; on failure, name a revoked column or a missing table.", "code": "src/pipeline/job.rs:1189-1207"}, {"t": "Reconcile with the source", "d": "Only when asked: count the source and compare with the rows exported.", "code": "src/pipeline/job.rs:1253-1264"}, {"t": "Write the manifest", "d": "\u003ccode>manifest.json\u003c/code> and \u003ccode>_SUCCESS\u003c/code>; a manifest that cannot be written turns the run into a failure.", "code": "src/pipeline/job.rs:1266-1271"}, {"t": "Store the journal and close the ledger row", "code": "src/pipeline/job.rs:1279-1293"}, {"t": "Advance the cursor", "d": "Only if the run succeeded with a manifest; otherwise the next run re-exports the window.", "code": "src/pipeline/job.rs:1294-1305"}, {"t": "Metrics, report, Slack", "code": "src/pipeline/job.rs:1318-1327", "async": true}, {"t": "Decide the result", "d": "Failure, a manifest gap, or any of the validate, reconcile and cursor gates.", "code": "src/pipeline/job.rs:1329-1331"}]}, "cdcsink": {"kind": "steps", "title": "Inside the capture sink: one roll", "sub": "What \u003ccode>roll_all\u003
